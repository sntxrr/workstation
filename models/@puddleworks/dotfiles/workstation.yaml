type: '@puddleworks/dotfiles'
typeVersion: 2026.11.09.1
id: af0b4931-187e-4195-8694-92b2a8c6d7f7
name: workstation
version: 1
tags: {}
globalArguments:
  target: { kind: local }
  sourceDir: dotfiles
  vars:
    scw_item: Scaleway-cli-pop-os   # 1Password item (in Private) holding this host's Scaleway API key
  items:
    # --- 0) swamp itself (bootstrap.sh installs it on a fresh machine;
    #        this keeps it declared so `verify` catches it going missing) ---
    - kind: command
      run: >-
        mkdir -p ~/.local/bin &&
        curl -fsSL https://swamp-club.com/install.sh | sh -s -- -d ~/.local/bin
      unless: command -v swamp

    # --- apt repos (each runs its own apt-get update so the installs below see it) ---
    - kind: command   # 1Password: repo + key + debsig policy, per 1Password's Linux docs
      run: >-
        set -e; k=https://downloads.1password.com/linux/keys/1password.asc;
        curl -fsSL "$k" | sudo -n gpg --batch --yes --dearmor -o /usr/share/keyrings/1password-archive-keyring.gpg;
        echo 'deb [arch=amd64 signed-by=/usr/share/keyrings/1password-archive-keyring.gpg] https://downloads.1password.com/linux/debian/amd64 stable main'
        | sudo -n tee /etc/apt/sources.list.d/1password.list >/dev/null;
        sudo -n mkdir -p /etc/debsig/policies/AC2D62742012EA22 /usr/share/debsig/keyrings/AC2D62742012EA22;
        curl -fsSL https://downloads.1password.com/linux/debian/debsig/1password.pol
        | sudo -n tee /etc/debsig/policies/AC2D62742012EA22/1password.pol >/dev/null;
        curl -fsSL "$k" | sudo -n gpg --batch --yes --dearmor -o /usr/share/debsig/keyrings/AC2D62742012EA22/debsig.gpg;
        sudo -n apt-get update -qq
      unless: >-
        test -s /usr/share/keyrings/1password-archive-keyring.gpg &&
        ls /etc/apt/sources.list.d/1password.list /etc/apt/sources.list.d/1password.sources 2>/dev/null | grep -q .
    - kind: command   # GitHub CLI repo, per cli.github.com Linux docs
      run: >-
        set -e; sudo -n mkdir -p -m 755 /etc/apt/keyrings;
        curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg
        | sudo -n tee /etc/apt/keyrings/githubcli-archive-keyring.gpg >/dev/null;
        sudo -n chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg;
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main"
        | sudo -n tee /etc/apt/sources.list.d/github-cli.list >/dev/null;
        sudo -n apt-get update -qq
      unless: >-
        test -s /etc/apt/keyrings/githubcli-archive-keyring.gpg &&
        test -f /etc/apt/sources.list.d/github-cli.list

    # --- 1Password app + CLI, GitHub CLI ---
    - { kind: package, package: 1password }
    - { kind: package, package: 1password-cli }
    - { kind: package, package: gh }

    # --- 1) starship + CaskaydiaCove Nerd Font (same font as ufo) ---
    - kind: command
      run: >-
        mkdir -p ~/.local/bin &&
        curl -fsSL https://starship.rs/install.sh | sh -s -- -y -b ~/.local/bin
      unless: test -x ~/.local/bin/starship
    - { kind: file, src: starship/starship.toml, dest: ~/.config/starship.toml }
    - kind: command
      run: >-
        d=~/.local/share/fonts/CaskaydiaCoveNerdFont && mkdir -p "$d" &&
        curl -fsSL https://github.com/ryanoasis/nerd-fonts/releases/download/v3.5.1/CascadiaCode.tar.xz
        | tar -xJ -C "$d" --wildcards '*.ttf' &&
        fc-cache -f "$d"
      unless: fc-list | grep -q 'CaskaydiaCove Nerd Font'

    # --- 2) zsh + .zshrc (from ufo, made Linux-safe) ---
    - { kind: package, package: zsh }
    - { kind: file, src: zsh/.zshrc, dest: ~/.zshrc }
    - kind: command
      run: sudo -n chsh -s /usr/bin/zsh "$(id -un)"
      unless: >-
        getent passwd "$(id -un)" | cut -d: -f7 | grep -q zsh

    # --- 3) lla + synthwave_84 theme ---
    - kind: command
      run: >-
        set -e; t=$(mktemp -d); cd "$t";
        curl -fsSLO https://github.com/chaqchase/lla/releases/download/v0.9.2/lla-linux-amd64;
        curl -fsSLO https://github.com/chaqchase/lla/releases/download/v0.9.2/SHA256SUMS;
        grep ' lla-linux-amd64$' SHA256SUMS | sha256sum -c -;
        mkdir -p ~/.local/bin; install -m 0755 lla-linux-amd64 ~/.local/bin/lla;
        cd /; rm -rf "$t"
      unless: ~/.local/bin/lla --version 2>/dev/null | grep -q '0\.9\.2'
    - { kind: file, src: lla/config.toml, dest: ~/.config/lla/config.toml }
    - { kind: file, src: lla/themes/synthwave_84.toml, dest: ~/.config/lla/themes/synthwave_84.toml }

    # --- 4) exe.dev (no client: it's all `ssh exe.dev`) ---
    - kind: command   # pin the host key, only if it matches the fingerprint exe.dev publishes (docs/faq/host-key)
      run: >-
        set -e; k=$(ssh-keyscan -t rsa exe.dev 2>/dev/null);
        printf '%s\n' "$k" | ssh-keygen -lf - | grep -q 'SHA256:JJOP/lwiBGOMilfONPWZCXUrfK154cnJFXcqlsi6lPo';
        mkdir -p -m 700 ~/.ssh; printf '%s\n' "$k" >> ~/.ssh/known_hosts
      unless: ssh-keygen -F exe.dev >/dev/null
    - kind: command   # exe.dev's coding-agent skill, for Claude Code
      run: >-
        mkdir -p ~/.claude/skills/using-exe-dev &&
        curl -fsSL https://raw.githubusercontent.com/boldsoftware/exe.dev/main/skill/SKILL.md
        -o ~/.claude/skills/using-exe-dev/SKILL.md
      unless: test -s ~/.claude/skills/using-exe-dev/SKILL.md

    # --- 5) git (matches ufo; gh is the GitHub credential helper) ---
    - { kind: file, src: git/.gitconfig, dest: ~/.gitconfig }
    - { kind: file, src: git/ignore, dest: ~/.config/git/ignore }

    # --- 6) Scaleway CLI (credentials come from 1Password per call via the zshrc `scw` wrapper) ---
    - kind: command
      run: >-
        set -e; t=$(mktemp -d); cd "$t"; v=2.67.0; b=scaleway-cli_${v}_linux_amd64;
        curl -fsSLO "https://github.com/scaleway/scaleway-cli/releases/download/v$v/$b";
        curl -fsSLO "https://github.com/scaleway/scaleway-cli/releases/download/v$v/SHA256SUMS";
        grep " $b\$" SHA256SUMS | sha256sum -c -;
        mkdir -p ~/.local/bin; install -m 0755 "$b" ~/.local/bin/scw;
        cd /; rm -rf "$t"
      unless: ~/.local/bin/scw version 2>/dev/null | grep -q '2\.67\.0'
    - { kind: file, src: scw/config.yaml, dest: ~/.config/scw/config.yaml, mode: "0600" }
    - { kind: file, src: scw/op.env.tmpl, dest: ~/.config/scw/op.env, template: true, mode: "0600" }

    # --- 7) Beeper Desktop: no official .deb, so repackage the pinned AppImage into one
    #        (installs to /opt/beeper; bump v + sha together to update) ---
    - { kind: package, package: squashfs-tools }
    - { kind: file, src: beeper/build-beeper-deb.sh, dest: ~/.local/bin/build-beeper-deb, mode: "0755" }
    - kind: command
      run: >-
        set -e; v=4.3.352; t=$(mktemp -d); a="$t/Beeper-$v-x86_64.AppImage";
        curl -fsSL -o "$a" "https://beeper-desktop.download.beeper.com/builds/Beeper-$v-x86_64.AppImage";
        echo "b642f83d708d4e49c4a5d1e749d86c5e5cced78d6d0b7d5a937c97eba755e048  $a" | sha256sum -c -;
        bash ~/.local/bin/build-beeper-deb "$a" "$t" "$v";
        sudo -n apt-get install -y "$t/beeper_${v}_amd64.deb";
        rm -rf "$t"
      unless: dpkg-query -W -f='${Version}' beeper 2>/dev/null | grep -qx '4\.3\.352'

    # --- 8) Claude Code status line (mirrors the starship prompt; same as ufo) ---
    - { kind: package, package: jq }
    - { kind: file, src: claude/statusline-command.sh, dest: ~/.claude/statusline-command.sh }
    - kind: command   # point settings.json at it without owning the rest of the file
      name: claude-statusline-setting
      run: >-
        set -e; f=~/.claude/settings.json; mkdir -p ~/.claude; [ -s "$f" ] || echo '{}' > "$f";
        jq '.statusLine = {"type":"command","command":"bash ~/.claude/statusline-command.sh"}' "$f" > "$f.tmp"
        && mv "$f.tmp" "$f"
      unless: jq -e '.statusLine.command | test("statusline-command\\.sh")' ~/.claude/settings.json >/dev/null 2>&1

    # --- 9) Herdr: jpisgeek/nightwire layout, installed from upstream at a pinned
    #        commit (nothing of it is vendored here), then my two size tweaks ---
    - kind: command
      name: herdr-nightwire
      run: >-
        set -e; export PATH="$HOME/.local/bin:$PATH"; t=$(mktemp -d);
        git clone -q https://github.com/jpisgeek/nightwire.git "$t";
        git -C "$t" checkout -q 3cdc52d12987ed72a7c66cadb858bcd49e61a8a7;
        sh "$t/install.sh"; rm -rf "$t"
      unless: test -d ~/.config/herdr-app/mods/nightwire-fleet
    - kind: command   # compact sidebar header (46 -> 24px), sidebar 277px wide
      name: herdr-nightwire-tweaks
      run: >-
        set -e; f=~/.config/herdr-app/layouts/nightwire.json;
        jq '(.. | objects | select(.id == "sidebar-head") | .size.px) = 24
        | (.. | objects | select(.id == "sidebar") | .size.px) = 277' "$f" > "$f.tmp"
        && mv "$f.tmp" "$f"
      unless: >-
        jq -e '[.. | objects | select(.id == "sidebar-head" or .id == "sidebar") | .size.px]
        == [277, 24]' ~/.config/herdr-app/layouts/nightwire.json >/dev/null 2>&1
methods: {}
