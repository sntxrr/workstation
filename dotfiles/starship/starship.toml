format = """
[](#9A348E)\
$os\
[ ](bg:#9A348E)\
[](bg:#DA627D fg:#9A348E)\
$directory\
[](fg:#DA627D bg:#FCA17D)\
$git_branch\
$git_status\
[](fg:#FCA17D bg:#86BBD8)\
$c\
$elixir\
$elm\
$golang\
$gradle\
$haskell\
$java\
$julia\
$nodejs\
$nim\
$rust\
$scala\
[](fg:#86BBD8 bg:#06969A)\
$docker_context\
[](fg:#06969A) \
"""

right_format = """
[](fg:#FCA17D)\
$username\
[](bg:#FCA17D fg:#DA627D)\
[ @ ](bg:#DA627D fg:#1E1E2E bold)\
[](bg:#DA627D fg:#86BBD8)\
$hostname\
[](bg:#86BBD8 fg:#06969A)\
$time\
[](bg:#06969A fg:#33658A)\
${custom.datemodule}\
[](fg:#33658A)\
"""

# Disable the blank line at the start of the prompt
# add_newline = false

# You can also replace your username with a neat symbol like   or disable this
# and use the os module below
[username]
show_always = true
style_user = "bg:#FCA17D fg:#1E1E2E bold"
style_root = "bg:#FCA17D fg:#1E1E2E bold"
format = '[ $user ]($style)'
disabled = false

[hostname]
ssh_only = false
style = "bg:#86BBD8 fg:#1E1E2E bold"
# Nerd Font globe (nf-md-web) rather than the default 🌐 emoji, which ignores fg
ssh_symbol = "\U000F059F "
format = '[ $ssh_symbol$hostname ]($style)'
disabled = false

# An alternative to the username module which displays a symbol that
# represents the current operating system
[os]
style = "bg:#9A348E fg:#1E1E2E bold"
disabled = true # Disabled by default

[directory]
style = "bg:#DA627D fg:#1E1E2E bold"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

# Here is how you can shorten some long paths by text replacement
# similar to mapped_locations in Oh My Posh:
[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
# Keep in mind that the order matters. For example:
# "Important Documents" = " 󰈙 "
# will not be replaced, because "Documents" was already substituted before.
# So either put "Important Documents" before "Documents" or use the substituted version:
# "Important 󰈙 " = " 󰈙 "

[c]
symbol = " "
style = "bg:#86BBD8 fg:#1E1E2E bold"
format = '[ $symbol ($version) ]($style)'

[cpp]
symbol = " "
style = "bg:#86BBD8 fg:#1E1E2E bold"
format = '[ $symbol ($version) ]($style)'

[docker_context]
symbol = " "
style = "bg:#06969A fg:#1E1E2E bold"
format = '[ $symbol $context ]($style)'

[elixir]
symbol = " "
style = "bg:#86BBD8 fg:#1E1E2E bold"
format = '[ $symbol ($version) ]($style)'

[elm]
symbol = " "
style = "bg:#86BBD8 fg:#1E1E2E bold"
format = '[ $symbol ($version) ]($style)'

[git_branch]
symbol = ""
style = "bg:#FCA17D fg:#1E1E2E bold"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:#FCA17D fg:#1E1E2E bold"
format = '[$all_status$ahead_behind ]($style)'

[golang]
symbol = " "
style = "bg:#86BBD8 fg:#1E1E2E bold"
format = '[ $symbol ($version) ]($style)'

[gradle]
style = "bg:#86BBD8 fg:#1E1E2E bold"
format = '[ $symbol ($version) ]($style)'

[haskell]
symbol = " "
style = "bg:#86BBD8 fg:#1E1E2E bold"
format = '[ $symbol ($version) ]($style)'

[java]
